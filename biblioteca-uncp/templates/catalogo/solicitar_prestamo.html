{% extends 'base.html' %}{% block title %}Solicitar préstamo · Biblioteca UNCP{% endblock %}{% block content %}<section class="auth-page"><div class="container"><div class="panel auth-form"><span class="eyebrow">Préstamo bibliográfico</span><h2>Solicitar “{{ libro.titulo|default:'Libro sin título' }}”</h2><p class="auth-subtitle">Confirma tu solicitud. El plazo estándar es de 15 días.</p><form method="post">{% csrf_token %}<button class="button button-primary" type="submit">Confirmar préstamo</button><a class="button button-outline" href="{% url 'catalogo:detalle_libro' libro.pk %}">Volver</a></form></div></div></section>{% endblock %}
